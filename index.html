<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="週間目標" />
  <title>週間目標＆反省</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">
  <div id="app" class="max-w-lg mx-auto px-4 pt-5"></div>

  <script>
    // アイコンとマニフェストの動的生成（ホーム画面追加対応）
    (function setupPWA() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, 512, 512);
        grad.addColorStop(0, '#4f46e5');
        grad.addColorStop(1, '#10b981');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(0, 0, 512, 512, 112);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 44;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(145, 265); ctx.lineTo(220, 340); ctx.lineTo(375, 175);
        ctx.stroke();
        const iconUrl = canvas.toDataURL('image/png');
        const appleIcon = document.createElement('link');
        appleIcon.rel = 'apple-touch-icon';
        appleIcon.href = iconUrl;
        document.head.appendChild(appleIcon);

        const manifest = {
          name: "週間目標＆反省",
          short_name: "週間目標",
          start_url: window.location.href,
          display: "standalone",
          background_color: "#f8fafc",
          theme_color: "#4f46e5",
          icons: [{ src: iconUrl, sizes: "512x512", type: "image/png" }]
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(blob);
        document.head.appendChild(manifestLink);
      } catch (e) {}
    })();

    // 日付計算（日曜始まり〜土曜終わり）
    function getSundayOfWeek(date) {
      const d = new Date(date);
      d.setDate(d.getDate() - d.getDay());
      d.setHours(0, 0, 0, 0);
      return d;
    }
    function formatWeekId(sunday) {
      const y = sunday.getFullYear();
      const m = String(sunday.getMonth() + 1).padStart(2, '0');
      const d = String(sunday.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    function formatWeekRange(sunday) {
      const sat = new Date(sunday);
      sat.setDate(sat.getDate() + 6);
      return `${sunday.getFullYear()}年${sunday.getMonth() + 1}月${sunday.getDate()}日(日) 〜 ${sat.getMonth() + 1}月${sat.getDate()}日(土)`;
    }

    // 状態管理（iPhone本体に自動保存）
    const STORAGE_KEY = 'weekly_goals_app_v1';
    let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || {
      weeks: {},
      notifyEnabled: false,
      lastNotifiedWeek: ''
    };
    let currentSunday = getSundayOfWeek(new Date());
    let bannerAlert = null;
    let showShareModal = false;
    let showHelpModal = false;

    // URLハッシュ経由の共有データ読み込み（Googleアカウント等でリンク共有）
    (function loadSharedFromUrl() {
      if (window.location.hash.startsWith('#share=')) {
        try {
          const encoded = decodeURIComponent(window.location.hash.slice(7));
          const sharedData = JSON.parse(decodeURIComponent(escape(atob(encoded))));
          if (sharedData && sharedData.weekId && sharedData.data) {
            state.weeks[sharedData.weekId] = sharedData.data;
            saveState();
            const parts = sharedData.weekId.split('-').map(Number);
            currentSunday = new Date(parts[0], parts[1] - 1, parts[2]);
            history.replaceState(null, '', window.location.pathname);
            bannerAlert = { title: '共有データを読み込みました', body: `${formatWeekRange(currentSunday)} の目標と反省を取り込みました。` };
          }
        } catch (e) {}
      }
    })();

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getWeekData(weekId) {
      if (!state.weeks[weekId]) {
        const isCurrent = weekId === formatWeekId(getSundayOfWeek(new Date()));
        state.weeks[weekId] = {
          goals: isCurrent ? [
            { id: '1', text: '毎日30分勉強または読書をする', completed: false },
            { id: '2', text: '週末に部屋の片付けをする', completed: false }
          ] : [],
          reflection: ''
        };
      }
      return state.weeks[weekId];
    }

    // 土曜日 午前9:00 未達リマインド通知チェック
    function triggerNotification(isTest = false) {
      const thisWeekId = formatWeekId(getSundayOfWeek(new Date()));
      const data = getWeekData(thisWeekId);
      const uncompleted = data.goals.filter(g => !g.completed);

      if (!isTest && uncompleted.length === 0) return;

      const title = isTest ? '【テスト通知】土曜日 9:00 未達リマインド' : '週間目標のリマインド（土曜日 9:00）';
      const body = uncompleted.length > 0
        ? `今週の目標が残り ${uncompleted.length} 件未達です！（例：「${uncompleted[0].text}」）今日が最終日です！`
        : '今週の目標はすべて達成されています！素晴らしい1週間ですね！';

      bannerAlert = { title, body };
      render();

      if ('Notification' in window && Notification.permission === 'granted') {
        try { new Notification(title, { body }); } catch (e) {}
      }
    }

    setInterval(() => {
      if (!state.notifyEnabled) return;
      const now = new Date();
      const thisWeekId = formatWeekId(getSundayOfWeek(now));
      // 土曜日(6)の午前9時以降で、今週まだ通知していない場合
      if (now.getDay() === 6 && now.getHours() >= 9 && state.lastNotifiedWeek !== thisWeekId) {
        const uncompleted = getWeekData(thisWeekId).goals.filter(g => !g.completed);
        if (uncompleted.length > 0) {
          state.lastNotifiedWeek = thisWeekId;
          saveState();
          triggerNotification(false);
        }
      }
    }, 30000);

    // 操作関数
    window.changeWeek = (offset) => {
      currentSunday.setDate(currentSunday.getDate() + offset * 7);
      render();
    };
    window.goToday = () => {
      currentSunday = getSundayOfWeek(new Date());
      render();
    };
    window.addGoal = (e) => {
      e.preventDefault();
      const input = document.getElementById('newGoalInput');
      const text = input.value.trim();
      if (!text) return;
      const weekId = formatWeekId(currentSunday);
      getWeekData(weekId).goals.push({ id: String(Date.now()), text, completed: false });
      saveState();
      render();
    };
    window.toggleGoal = (id) => {
      const weekId = formatWeekId(currentSunday);
      const goal = getWeekData(weekId).goals.find(g => g.id === id);
      if (goal) goal.completed = !goal.completed;
      saveState();
      render();
    };
    window.deleteGoal = (id) => {
      const weekId = formatWeekId(currentSunday);
      const data = getWeekData(weekId);
      data.goals = data.goals.filter(g => g.id !== id);
      saveState();
      render();
    };
    window.updateReflection = (val) => {
      const weekId = formatWeekId(currentSunday);
      getWeekData(weekId).reflection = val;
      saveState();
    };
    window.toggleNotify = async () => {
      if (!state.notifyEnabled) {
        if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
          await Notification.requestPermission();
        }
        state.notifyEnabled = true;
      } else {
        state.notifyEnabled = false;
      }
      saveState();
      render();
    };
    window.testNotify = () => triggerNotification(true);
    window.closeBanner = () => { bannerAlert = null; render(); };
    window.toggleShare = (v) => { showShareModal = v; render(); };
    window.toggleHelp = (v) => { showHelpModal = v; render(); };

    window.copyShareLink = () => {
      const weekId = formatWeekId(currentSunday);
      const payload = { weekId, data: getWeekData(weekId) };
      const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
      const url = `${window.location.origin}${window.location.pathname}#share=${encodeURIComponent(encoded)}`;
      if (navigator.share) {
        navigator.share({ title: '週間目標の共有', text: `${formatWeekRange(currentSunday)}の目標`, url }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url);
        alert('共有リンクをコピーしました！LINEやGmailで送れます。');
      }
    };

    // 画面描画
    function render() {
      const weekId = formatWeekId(currentSunday);
      const isThisWeek = weekId === formatWeekId(getSundayOfWeek(new Date()));
      const data = getWeekData(weekId);
      const total = data.goals.length;
      const done = data.goals.filter(g => g.completed).length;
      const percent = total === 0 ? 0 : Math.round((done / total) * 100);

      document.getElementById('app').innerHTML = `
        <!-- ヘッダー -->
        <header class="flex items-center justify-between mb-4">
          <div>
            <h1 class="text-xl font-bold text-slate-900">週間目標＆反省</h1>
            <p class="text-xs text-slate-500">日曜始まり・土曜締め</p>
          </div>
          <div class="flex gap-2">
            <button onclick="toggleHelp(true)" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-indigo-50 text-indigo-700 active:scale-95">ホーム追加</button>
            <button onclick="toggleShare(true)" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-emerald-50 text-emerald-700 active:scale-95">共有</button>
          </div>
        </header>

        ${bannerAlert ? `
          <div class="mb-4 p-3.5 rounded-2xl bg-amber-50 border border-amber-200 flex items-start justify-between gap-2">
            <div>
              <p class="text-xs font-bold text-amber-900">${bannerAlert.title}</p>
              <p class="text-xs text-amber-800 mt-0.5">${bannerAlert.body}</p>
            </div>
            <button onclick="closeBanner()" class="text-amber-600 text-sm font-bold px-1">✕</button>
          </div>
        ` : ''}

        <!-- 週切り替え -->
        <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-100 flex items-center justify-between mb-4">
          <button onclick="changeWeek(-1)" class="px-3 py-1.5 rounded-xl bg-slate-100 text-sm font-bold active:scale-95">◀ 前週</button>
          <div class="text-center">
            <div class="text-sm font-bold text-slate-800">${formatWeekRange(currentSunday)}</div>
            ${isThisWeek
              ? '<span class="text-[11px] font-semibold text-indigo-600">今週</span>'
              : '<button onclick="goToday()" class="text-[11px] text-slate-500 underline">今週に戻る</button>'
            }
          </div>
          <button onclick="changeWeek(1)" class="px-3 py-1.5 rounded-xl bg-slate-100 text-sm font-bold active:scale-95">次週 ▶</button>
        </div>

        <!-- 土曜9時通知設定 -->
        <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-100 flex items-center justify-between mb-4">
          <div>
            <div class="text-xs font-bold text-slate-800">土曜 9:00 未達リマインド ${state.notifyEnabled ? '<span class="text-emerald-600">ON</span>' : '<span class="text-slate-400">OFF</span>'}</div>
            <div class="text-[11px] text-slate-500">未達がある場合、最終日(土曜)朝9時に通知</div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="testNotify()" class="px-2.5 py-1.5 rounded-lg bg-slate-100 text-[11px] font-medium text-slate-700 active:scale-95">テスト</button>
            <button onclick="toggleNotify()" class="w-12 h-7 rounded-full transition p-1 ${state.notifyEnabled ? 'bg-indigo-600' : 'bg-slate-300'}">
              <div class="w-5 h-5 rounded-full bg-white transition transform ${state.notifyEnabled ? 'translate-x-5' : 'translate-x-0'}"></div>
            </button>
          </div>
        </div>

        <!-- 1週間の目標 -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-4">
          <div class="flex items-center justify-between mb-2">
            <h2 class="text-base font-bold text-slate-900">1週間の目標</h2>
            <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-700">${done}/${total} 達成 (${percent}%)</span>
          </div>
          <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden mb-3">
            <div class="h-full bg-indigo-600 transition-all" style="width: ${percent}%"></div>
          </div>

          <form onsubmit="addGoal(event)" class="flex gap-2 mb-3">
            <input id="newGoalInput" type="text" placeholder="目標を入力（例：毎日英単語20個）" class="flex-1 px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:border-indigo-500" />
            <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-bold active:scale-95">追加</button>
          </form>

          <ul class="space-y-2">
            ${data.goals.length === 0 ? '<li class="text-xs text-slate-400 text-center py-4">目標がまだありません。上の欄から追加しよう！</li>' : ''}
            ${data.goals.map(g => `
              <li class="flex items-center justify-between p-2.5 rounded-xl border ${g.completed ? 'bg-slate-50 border-slate-100' : 'bg-white border-slate-200'}">
                <button onclick="toggleGoal('${g.id}')" class="flex items-center gap-2.5 flex-1 text-left">
                  <span class="w-5 h-5 rounded-md flex items-center justify-center border ${g.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300'} text-xs font-bold">
                    ${g.completed ? '✓' : ''}
                  </span>
                  <span class="text-sm ${g.completed ? 'line-through text-slate-400' : 'text-slate-800'}">${g.text}</span>
                </button>
                <button onclick="deleteGoal('${g.id}')" class="text-xs text-slate-400 hover:text-rose-500 px-2 py-1">削除</button>
              </li>
            `).join('')}
          </ul>
        </section>

        <!-- 1週間の反省（3行欄） -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
          <div class="flex items-center justify-between mb-2">
            <h2 class="text-base font-bold text-slate-900">1週間の反省</h2>
            <span class="text-[11px] text-emerald-600 font-medium">✓ 自動保存</span>
          </div>
          <textarea rows="3" oninput="updateReflection(this.value)" placeholder="今週の振り返りや来週への改善点を3行程度で書こう..." class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:border-indigo-500">${data.reflection}</textarea>
        </section>

        <!-- 共有モーダル -->
        ${showShareModal ? `
          <div class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-2xl p-5 max-w-sm w-full">
              <h3 class="text-base font-bold mb-2">他のGoogleアカウントへ共有</h3>
              <p class="text-xs text-slate-600 mb-4">下のボタンを押すと、今週の目標と反省が入った専用リンクが作成されます。GmailやGoogleチャット、LINE等で送ると相手の端末でも開けます。</p>
              <button onclick="copyShareLink()" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-bold mb-2">共有リンクを送る / コピー</button>
              <button onclick="toggleShare(false)" class="w-full py-2 rounded-xl bg-slate-100 text-slate-600 text-xs font-bold">閉じる</button>
            </div>
          </div>
        ` : ''}

        <!-- ホーム追加モーダル -->
        ${showHelpModal ? `
          <div class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-2xl p-5 max-w-sm w-full">
              <h3 class="text-base font-bold mb-2">iPhoneホーム画面への追加方法</h3>
              <ol class="text-xs text-slate-700 space-y-2 list-decimal pl-4 mb-4">
                <li>Safari画面一番下の<strong>共有ボタン（四角から上矢印のマーク）</strong>をタップ</li>
                <li>下にスクロールして<strong>「ホーム画面に追加」</strong>をタップ</li>
                <li>右上の<strong>「追加」</strong>をタップして完了！</li>
              </ol>
              <button onclick="toggleHelp(false)" class="w-full py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">わかった</button>
            </div>
          </div>
        ` : ''}
      `;
    }
    render();
  </script>
</body>
</html>
